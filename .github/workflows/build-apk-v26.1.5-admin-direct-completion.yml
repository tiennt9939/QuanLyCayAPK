name: Build ROLL CAY CANH V26.1.5 — Admin Direct Completion (No Photo)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: roll-cay-canh-v26-1-4-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare V26.1.5 Android source
        shell: bash
        run: |
          set -euo pipefail
          source_is_v2615() {
            [[ -f "$1/settings.gradle.kts" && \
               -f "$1/build.gradle.kts" && \
               -f "$1/app/build.gradle.kts" && \
               -f "$1/app/src/main/AndroidManifest.xml" && \
               -f "$1/app/src/main/assets/index.html" && \
               -f "$1/app/src/main/java/com/quanlycay/apk/MainActivity.java" && \
               -f "$1/tools/preflight.py" ]] && \
            grep -q 'versionName = "26.1.5"' "$1/app/build.gradle.kts" && \
            grep -q 'versionCode = 47' "$1/app/build.gradle.kts"
          }
          if source_is_v2615 "."; then
            echo "Using V26.1.5 source at repository root."
            exit 0
          fi
          archive="QuanLyCayAPK-V26.1.5-ADMIN-DIRECT-COMPLETION.zip"
          if [[ ! -s "$archive" ]]; then
            echo "::error::Repository root is not V26.1.5 and required archive is missing: $archive"
            echo "Upload the V26.1.5 source ZIP to the repository root, then run this workflow again."
            find . -maxdepth 4 -type f | sort | head -250
            exit 1
          fi
          extract="$RUNNER_TEMP/quanlycay-v2614"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          source_root=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if source_is_v2615 "$candidate"; then source_root="$candidate"; break; fi
          done < <(find "$extract" -type f -name settings.gradle.kts -print)
          if [[ -z "$source_root" ]]; then
            echo "::error::Could not find a complete V26.1.5 project in $archive."
            find "$extract" -maxdepth 7 -type f | sort | head -300
            exit 1
          fi
          echo "Extracting V26.1.5 source from: $source_root"
          cp -a "$source_root"/. .
          source_is_v2615 "."

      - name: Verify source and Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/quanlycay/apk/MainActivity.java
          test -s firestore.rules
          grep -q 'versionName = "26.1.5"' app/build.gradle.kts
          grep -q 'versionCode = 47' app/build.gradle.kts
          echo "V26.1.5 / code 47 source check: PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run audits and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py
          node tools/retention_logic_test.js
          node tools/packing_wage_rules_test.js
          node tools/drive_image_persistence_test.js
          node tools/packer_assignment_ui_test.js
          node tools/admin_direct_completion_test.js
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S | re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks):
                  path = Path(td) / f'script_{i}.js'
                  path.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'JavaScript syntax passed for {len(blocks)} script blocks')
          PY

      - name: Configure stable debug signing key when available
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEBUG_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
            test -s app/debug.keystore
            keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "Stable debug keystore configured."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; standard temporary debug signing will be used."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.5-ADMIN-DIRECT-COMPLETION-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.5-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
