
name: Build QuanLyCayAPK V25.4.4 V25.4.4

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate V25.4.4 source unambiguously
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source
          mkdir -p build_source

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            SOURCE_ZIP="V2544_ROOT_FIX.zip"
            if [ ! -f "$SOURCE_ZIP" ]; then
              echo "ERROR: Missing $SOURCE_ZIP"
              echo "Existing ZIP files:"; find . -maxdepth 1 -type f -name '*.zip' -print | sort || true
              exit 1
            fi
            unzip -q "$SOURCE_ZIP" -d build_source
            PROJECT_DIR="$(find build_source -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi

          if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android project not found"; exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using source: $PROJECT_DIR"

      - name: Static preflight before Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 tools/preflight.py
          test "$(grep -c -E '^[[:space:]]*@JavascriptInterface[[:space:]]*$' app/src/main/java/com/quanlycay/apk/MainActivity.java)" -eq 1
          if grep -n -A1 '@JavascriptInterface' app/src/main/java/com/quanlycay/apk/MainActivity.java | grep -q -E '@JavascriptInterface.*@JavascriptInterface'; then echo 'ERROR: consecutive duplicate @JavascriptInterface'; exit 1; fi
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          with tempfile.TemporaryDirectory() as td:
              for i,b in enumerate(blocks):
                  p=Path(td)/f'script_{i}.js'; p.write_text(b,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print('JavaScript syntax: PASS')
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V25.4.4-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
