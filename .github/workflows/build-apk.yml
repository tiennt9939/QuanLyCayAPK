name: Build QuanLyCayAPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "KHÔNG TÌM THẤY Android project"
            echo "Các file settings.gradle tìm được:"
            find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
            exit 1
          fi

          echo "Đã tìm thấy Android project tại: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/app/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "KHÔNG TÌM THẤY APK"
            exit 1
          fi

          echo "Đã tìm thấy APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-debug
          path: ${{ env.APK_PATH }}
