name: Build QuanLyCayAPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "=== TIM FILE ZIP ==="
          ls -lh QuanLyCayAPK_project.zip

          rm -rf build_source
          mkdir -p build_source

          echo "=== GIAI NEN PROJECT ==="
          unzip -q -o QuanLyCayAPK_project.zip -d build_source

          echo "=== TIM ANDROID PROJECT ==="
          PROJECT_DIR="$(find build_source -type f \
            -name settings.gradle.kts \
            -print -quit | xargs -r dirname)"

          echo "PROJECT_DIR=$PROJECT_DIR"

          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== ANDROID PROJECT DA DUOC TIM THAY ==="
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
