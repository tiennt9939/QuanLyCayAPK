name: Build QuanLyCayAPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: 'platform-tools'
  
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project ZIP
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q QuanLyCayAPK_project.zip -d build_source
    
      - name: Find project folder
        id: find_project
        shell: bash
        run: |
          PROJECT_DIR=$(find build_source -type f -name "settings.gradle.kts" -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Không tìm thấy settings.gradle.kts"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: |
         cd "${{ steps.find_project.outputs.project_dir }}"
         chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: find_apk
        shell: bash
        run: |
         APK=$(find build_source -type f -path "*/app/build/outputs/apk/debug/app-debug.apk" -print -quit)
         if [ -z "$APK" ]; then
         echo "Không tìm thấy APK"
         exit 1
         fi
         echo "APK=$APK"
         echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
       with:
        name: QuanLyCayAPK-debug
        path: ${{ steps.find_apk.outputs.apk_path }}
