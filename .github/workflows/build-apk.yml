name: Build ROLL CÂY CẢNH V25.5.6 STABLE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/usr/local/lib/android/sdk" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          elif [ -d "$HOME/Android/Sdk" ]; then
            export ANDROID_HOME="$HOME/Android/Sdk"
          else
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/tmp/sdkmanager-licenses.log 2>&1 || true

          tail -50 /tmp/sdkmanager-licenses.log || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --update || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list \
            | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0' \
            | head -20 || true

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK verification: PASS"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify V25.5.6 source
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/quanlycay/apk/MainActivity.java

          grep -q '25.5.6' app/build.gradle.kts

          echo "======================================"
          echo "V25.5.6 SOURCE CHECK: PASS"
          echo "======================================"

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail

          if [ -f tools/preflight.py ]; then
            python3 tools/preflight.py
          else
            echo "ERROR: tools/preflight.py not found"
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node --version

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          p = Path("app/src/main/assets/index.html")
          text = p.read_text(encoding="utf-8")

          blocks = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.S | re.I
          )

          print(f"JavaScript blocks found: {len(blocks)}")

          if not blocks:
              raise SystemExit("ERROR: No JavaScript blocks found")

          with tempfile.TemporaryDirectory() as d:
              for i, block in enumerate(blocks, 1):
                  f = Path(d) / f"script_{i}.js"
                  f.write_text(block, encoding="utf-8")

                  result = subprocess.run(
                      ["node", "--check", str(f)],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode != 0:
                      print(result.stdout)
                      print(result.stderr)
                      raise SystemExit(
                          f"ERROR: JavaScript syntax error in block {i}"
                      )

          print("JavaScript syntax: PASS")
          PY

      - name: Check JavascriptInterface count
        shell: bash
        run: |
          set -euo pipefail

          COUNT=$(grep -c '@JavascriptInterface' \
            app/src/main/java/com/quanlycay/apk/MainActivity.java || true)

          echo "JavascriptInterface count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one @JavascriptInterface"
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V25.5.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
