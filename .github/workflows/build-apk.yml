name: Build QuanLyCayAPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          echo "================================"
          echo "TIM ZIP TRONG REPOSITORY"
          echo "================================"
          find . -maxdepth 3 -type f -name "*.zip" -print

          echo "================================"
          echo "GIAI NEN ZIP DAU TIEN"
          echo "================================"

          unzip -q -o QuanLyCayAPK_project.zip -d build_source

          PROJECT_DIR=""

          echo "================================"
          echo "TIM ANDROID PROJECT"
          echo "================================"

          for ROUND in 1 2 3 4; do

            PROJECT_DIR="$(find build_source \
              -type f \
              -name "settings.gradle.kts" \
              -print -quit | xargs -r dirname)"

            if [ -n "$PROJECT_DIR" ]; then
              echo "DA TIM THAY ANDROID PROJECT:"
              echo "$PROJECT_DIR"
              break
            fi

            echo "Chua tim thay project - lan $ROUND"

            NESTED_ZIP="$(find build_source \
              -type f \
              -name "*.zip" \
              -print -quit)"

            if [ -z "$NESTED_ZIP" ]; then
              echo "Khong con ZIP nao de giai nen."
              break
            fi

            echo "Tim thay ZIP long nhau:"
            echo "$NESTED_ZIP"

            NEXT_DIR="build_source/nested_$ROUND"
            mkdir -p "$NEXT_DIR"

            unzip -q -o "$NESTED_ZIP" -d "$NEXT_DIR"

          done

          echo "================================"
          echo "KIEM TRA KET QUA"
          echo "================================"

          find build_source -type f \
            -name "settings.gradle.kts" -print

          if [ -z "$PROJECT_DIR" ]; then
            echo "KHONG TIM THAY ANDROID PROJECT"
            echo "Danh sach file:"
            find build_source -maxdepth 6 -type f | sort
            exit 1
          fi

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "ANDROID PROJECT DA SAN SANG"
          echo "$PROJECT_DIR"
          echo "================================"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
