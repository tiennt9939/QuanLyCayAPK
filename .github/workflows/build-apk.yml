name: Build ROLL CÂY CẢNH V25.6.3 STABLE

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: roll-cay-canh-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f tools/preflight.py
          grep -q 'versionName = "25.6.3"' app/build.gradle.kts
          echo "ROOT CHECK PASS — V25.6.3"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py
          test "$(grep -c -E '^[[:space:]]*@JavascriptInterface[[:space:]]*$' app/src/main/java/com/quanlycay/apk/MainActivity.java)" -eq 3
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S|re.I)
          with tempfile.TemporaryDirectory() as td:
              for i,b in enumerate(blocks):
                  p=Path(td)/f'script_{i}.js'
                  p.write_text(b, encoding='utf-8')
                  subprocess.run(['node','--check',str(p)], check=True)
          print(f'JavaScript syntax: PASS ({len(blocks)} blocks)')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V25.6.3-STABLE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V25.6.3-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
