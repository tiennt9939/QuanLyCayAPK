name: Build QuanLyCayAPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source
          mkdir -p build_source

          echo "=== KIEM TRA REPOSITORY ==="
          find . -maxdepth 3 -type f | sort | sed -n '1,200p'

          # Neu source Android da nam truc tiep trong repository.
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          # Giai nen tat ca ZIP trong repository theo tung lop.
          # Ho tro ca QuanLyCayAPK_project.zip va goi bao ngoai co ten bat ky.
          shopt -s nullglob
          zip_list=(./*.zip)
          if [ ${#zip_list[@]} -eq 0 ]; then
            echo "Khong tim thay file ZIP o thu muc goc repository."
            exit 1
          fi

          for z in "${zip_list[@]}"; do
            echo "Giai nen ZIP: $z"
            unzip -o -q "$z" -d build_source
          done

          # Lap toi da 5 lop ZIP long nhau, dung ngay khi tim thay settings.gradle.kts.
          for round in 1 2 3 4 5; do
            PROJECT_DIR="$(find build_source -type f -name settings.gradle.kts -print -quit | xargs -r dirname || true)"
            if [ -n "$PROJECT_DIR" ]; then
              echo "Tim thay Android project: $PROJECT_DIR"
              test -f "$PROJECT_DIR/app/build.gradle.kts"
              echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
              exit 0
            fi

            mapfile -t nested_zips < <(find build_source -type f -name '*.zip' -print)
            if [ ${#nested_zips[@]} -eq 0 ]; then
              break
            fi

            echo "=== GIAI NEN LOP ZIP $round ==="
            for z in "${nested_zips[@]}"; do
              dest="${z%.zip}_extracted"
              mkdir -p "$dest"
              echo "Giai nen: $z -> $dest"
              unzip -o -q "$z" -d "$dest"
              rm -f "$z"
            done
          done

          echo "=== KHONG TIM THAY ANDROID PROJECT ==="
          find build_source -type f | sort | sed -n '1,300p'
          exit 1

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
