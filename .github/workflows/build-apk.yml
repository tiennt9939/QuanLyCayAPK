name: Build QuanLyCayAPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=== TIM ANDROID PROJECT TRUC TIEP ==="

          PROJECT_DIR=$(find . \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "./.git/*" \
            -print -quit | xargs -r dirname)

          if [ -n "$PROJECT_DIR" ]; then
            echo "Da tim thay Android project:"
            echo "$PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Khong tim thay project truc tiep."
          echo "=== TIM FILE ZIP ==="

          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "KHONG TIM THAY FILE ZIP"
            echo "=== CAC FILE TRONG REPOSITORY ==="
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "Tim thay ZIP:"
          echo "$ZIP_FILE"

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_FILE" -d build_source

          echo "=== TIM PROJECT TRONG ZIP ==="

          PROJECT_DIR=$(find build_source \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ZIP CO TON TAI NHUNG KHONG CO ANDROID PROJECT"
            echo "=== CAC FILE SETTINGS ==="
            find build_source -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print

            echo "=== CAC FILE DA GIAI NEN ==="
            find build_source -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          echo "Da tim thay Android project trong ZIP:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "Build project:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/app/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "KHONG TIM THAY APK"
            exit 1
          fi

          echo "Da tim thay APK:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-debug
          path: ${{ env.APK_PATH }}
