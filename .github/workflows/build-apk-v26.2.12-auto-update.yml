name: Build ROLL CAY CANH — GitHub Release + In-App Updater

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Tên ZIP source có bộ tự cập nhật (để trống nếu source mới nằm ở thư mục gốc). Với bản mới, chọn đúng ZIP có phiên bản cao hơn.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: roll-cay-canh-auto-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare auto-update-enabled Android source
        id: source_meta
        env:
          REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}
        shell: bash
        run: |
          set -Eeuo pipefail
          is_target_source() {
            local root="$1"
            [[ -f "$root/settings.gradle.kts" && \
               -f "$root/build.gradle.kts" && \
               -f "$root/app/build.gradle.kts" && \
               -f "$root/app/src/main/AndroidManifest.xml" && \
               -f "$root/app/src/main/assets/index.html" && \
               -f "$root/app/src/main/java/com/quanlycay/apk/MainActivity.java" && \
               -f "$root/app/src/main/res/xml/file_paths.xml" && \
               -f "$root/tools/preflight.py" ]] && \
              grep -Fq 'checkForAppUpdates' "$root/app/src/main/java/com/quanlycay/apk/MainActivity.java" && \
              grep -Fq 'appUpdatePanel' "$root/app/src/main/assets/index.html" && \
              grep -Eq 'versionName = "[0-9]+(\.[0-9]+)+"' "$root/app/build.gradle.kts" && \
              grep -Eq 'versionCode = [0-9]+' "$root/app/build.gradle.kts"
          }

          archive="${REQUESTED_SOURCE_ZIP:-}"
          source_root=""
          if [[ -n "$archive" ]]; then
            if [[ ! -s "$archive" ]]; then
              echo "::error::Không tìm thấy ZIP được chỉ định: $archive"
              exit 1
            fi
            echo "Using explicitly requested source archive: $archive"
          else
            # Blank input means select the highest versioned source ZIP. This allows
            # future source ZIP uploads to be picked without editing the workflow.
            while IFS= read -r candidate; do
              if [[ -s "$candidate" ]]; then archive="$candidate"; fi
            done < <(find . -type f -iname '*AUTO-UPDATE-SOURCE.zip' -not -path './.git/*' -print | sort -V)
            if [[ -n "$archive" ]]; then
              echo "Using newest matching source archive: $archive"
            elif is_target_source .; then
              echo "Using auto-update-enabled source at repository root."
              source_root="."
            else
              echo "::error::Không tìm thấy source Android có chức năng tự cập nhật."
              echo "Hãy upload ZIP AUTO-UPDATE-SOURCE vào repository hoặc commit source mới vào thư mục gốc."
              exit 1
            fi
          fi

          if [[ "$source_root" != "." ]]; then
            extract="$RUNNER_TEMP/quanlycay-auto-update-source"
            mkdir -p "$extract"
            unzip -q "$archive" -d "$extract"
            source_root=""
            while IFS= read -r settings; do
              candidate="$(dirname "$settings")"
              if is_target_source "$candidate"; then source_root="$candidate"; break; fi
            done < <(find "$extract" -type f -name settings.gradle.kts -print)
            if [[ -z "$source_root" ]]; then
              echo "::error::ZIP không chứa source có native updater, UI updater và Android version hợp lệ."
              find "$extract" -maxdepth 5 -type f | sort | head -200
              exit 1
            fi
            # Replace stale checkout files so tests/assets from the previous version
            # cannot leak into this build. Keep .git and the selected ZIP for diagnostics.
            archive_basename="$(basename "$archive")"
            find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name "$archive_basename" -exec rm -rf -- {} +
            cp -a "$source_root"/. .
          fi
          is_target_source . || { echo "::error::Source sau khi chuẩn bị không hợp lệ hoặc thiếu updater."; exit 1; }

          version_name="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "$version_name" =~ ^[0-9]+(\.[0-9]+)+$ || ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::versionName/versionCode không hợp lệ trong app/build.gradle.kts."
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Prepared V$version_name / code $version_code."

      - name: Verify source and Firestore configuration
        env:
          VERSION_NAME: ${{ steps.source_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.source_meta.outputs.version_code }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/quanlycay/apk/MainActivity.java
          test -s firestore.rules
          test -s firestore.indexes.json
          grep -Fq "versionName = \"$VERSION_NAME\"" app/build.gradle.kts
          grep -Fq "versionCode = $VERSION_CODE" app/build.gradle.kts
          echo "Source version V$VERSION_NAME / code $VERSION_CODE: PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run source audits and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/preflight.py
          for test in tools/*_test.js; do
            echo "Running $test"
            node "$test"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S | re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks):
                  path = Path(td) / f'script_{i}.js'
                  path.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          subprocess.run(['node', '--check', 'app/src/main/assets/tiktok-label-import.js'], check=True)
          print(f'JavaScript syntax passed for {len(blocks)} inline blocks plus external PDF parser')
          PY

      - name: Configure stable signing key when available
        id: signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          EXPECTED_APK_CERT_SHA256: ${{ secrets.EXPECTED_APK_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_cert="$(printf '%s' "${EXPECTED_APK_CERT_SHA256:-}" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${DEBUG_KEYSTORE_BASE64:-}" && -n "$expected_cert" ]]; then
            if [[ ! "$expected_cert" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::EXPECTED_APK_CERT_SHA256 phải là fingerprint SHA-256 gồm đúng 64 ký tự hex."
              exit 1
            fi
            # app/build.gradle.kts explicitly points stableDebug to app/debug.keystore.
            # Use the exact same location or Gradle would silently sign with another key.
            mkdir -p app
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "app/debug.keystore"
            test -s "app/debug.keystore"
            keytool -list -keystore "app/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Stable signing key configured; expected installed-app certificate fingerprint is set."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cần cấu hình CẢ DEBUG_KEYSTORE_BASE64 và EXPECTED_APK_CERT_SHA256. Build artifact vẫn được tạo, nhưng không phát hành GitHub Release nếu chưa kiểm tra được chữ ký trùng với APK đang cài."
          fi

      - name: Build and checksum APK
        env:
          VERSION_NAME: ${{ steps.source_meta.outputs.version_name }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          EXPECTED_APK_CERT_SHA256: ${{ secrets.EXPECTED_APK_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          # Always verify that the APK itself is valid. Only require a known
          # certificate fingerprint when stable signing is configured; without
          # signing secrets this workflow intentionally creates an artifact only.
          "$apksigner" verify "$apk"
          if [[ "$SIGNING_ENABLED" == 'true' ]]; then
            certificate_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            printf '%s\n' "$certificate_output"
            # Do not depend on a specific apksigner label/prefix; extract a 64-char
            # SHA-256 hex digest from its certificate line.
            actual_cert="$(printf '%s\n' "$certificate_output" | grep -Ei 'certificate SHA-256 digest' | grep -Eo '[A-Fa-f0-9]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]' || true)"
            if [[ ! "$actual_cert" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Đã bật ký ổn định nhưng không đọc được fingerprint SHA-256 của chứng thư ký APK."
              exit 1
            fi
            expected_cert="$(printf '%s' "$EXPECTED_APK_CERT_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual_cert" != "$expected_cert" ]]; then
              echo "::error::Chữ ký APK mới KHÔNG trùng EXPECTED_APK_CERT_SHA256 của ứng dụng đang cài. Đã chặn phát hành để tránh cập nhật thất bại."
              exit 1
            fi
            echo "APK signing certificate matches the installed-app fingerprint."
          else
            echo "::notice::Stable signing identity not configured; skipped fingerprint matching. APK artifact will be uploaded, and GitHub Release publication will be skipped."
          fi
          release_dir="$(dirname "$apk")"
          release_apk="$release_dir/QuanLyCayAPK-V${VERSION_NAME}.apk"
          cp "$apk" "$release_apk"
          (cd "$release_dir" && sha256sum "QuanLyCayAPK-V${VERSION_NAME}.apk" > "QuanLyCayAPK-V${VERSION_NAME}.apk.sha256")
          sha256sum "$apk"
          sha256sum "$release_apk"
          ls -lh "$apk" "$release_apk" "$release_apk.sha256"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V${{ steps.source_meta.outputs.version_name }}-AUTO-UPDATE-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/QuanLyCayAPK-V${{ steps.source_meta.outputs.version_name }}.apk
            app/build/outputs/apk/debug/QuanLyCayAPK-V${{ steps.source_meta.outputs.version_name }}.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for in-app updater
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.source_meta.outputs.version_name }}
          name: ROLL CÂY CẢNH V${{ steps.source_meta.outputs.version_name }} — Tự cập nhật trong ứng dụng
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            ROLL CÂY CẢNH V${{ steps.source_meta.outputs.version_name }} (versionCode: ${{ steps.source_meta.outputs.version_code }})

            - APK được phát hành từ workflow đã chạy kiểm thử nguồn.
            - Tính năng tự cập nhật kiểm tra GitHub Releases, xác minh SHA-256 rồi mở trình cài đặt Android.
            - Các chức năng hiện có được giữ theo source đã chọn: PDF TikTok, SKU/danh mục, phân công, quét mã vạch, ảnh Drive, tiền công và tồn kho.

            Android vẫn yêu cầu người dùng xác nhận cài đặt. APK phải được ký cùng keystore như bản đã cài để cập nhật đè.
          files: |
            app/build/outputs/apk/debug/QuanLyCayAPK-V${{ steps.source_meta.outputs.version_name }}.apk
            app/build/outputs/apk/debug/QuanLyCayAPK-V${{ steps.source_meta.outputs.version_name }}.apk.sha256

      - name: Explain skipped Release when signing identity is not verified
        if: steps.signing.outputs.enabled != 'true'
        env:
          VERSION_NAME: ${{ steps.source_meta.outputs.version_name }}
        run: echo "::notice::APK V$VERSION_NAME artifact created. GitHub Release publication was skipped because the stable signing keystore and expected installed-app certificate fingerprint were not both configured."

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
