name: Build ROLL CAY CANH V26.1.2 — Completion/Catalog/Wage Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: roll-cay-canh-v26-1-2-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare V26.1.2 Android source from ZIP when needed
        shell: bash
        run: |
          set -euo pipefail
          required_root() {
            local d="$1"
            [[ -f "$d/settings.gradle.kts" &&
               -f "$d/build.gradle.kts" &&
               -f "$d/app/build.gradle.kts" &&
               -f "$d/app/src/main/AndroidManifest.xml" &&
               -f "$d/app/src/main/assets/index.html" &&
               -f "$d/tools/preflight.py" ]]
          }
          if required_root "."; then
            echo "Complete source exists at repository root."
            exit 0
          fi
          archive="QuanLyCayAPK-V26.1.2-COMPLETION-CATALOG-WAGE-FIX.zip"
          if [[ ! -s "$archive" ]]; then
            echo "::error::Missing $archive. Upload the V26.1.2 source ZIP to repository root first."
            exit 1
          fi
          extract="$RUNNER_TEMP/quanlycay-v26-1-2"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          source_root=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if required_root "$candidate"; then source_root="$candidate"; break; fi
          done < <(find "$extract" -type f -name settings.gradle.kts -print)
          if [[ -z "$source_root" ]]; then
            echo "::error::No complete Android project found inside $archive."
            find "$extract" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi
          cp -a "$source_root"/. .
          echo "Loaded source from $archive"

      - name: Verify V26.1.2 source and Firestore Rules
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
          test -s tools/preflight.py
          test -s firestore.rules
          grep -q 'versionName = "26.1.2"' app/build.gradle.kts
          grep -q 'versionCode = 44' app/build.gradle.kts
          grep -q "t.matches('^VNGH\[0-9\]{8,12}\$')" firestore.rules
          grep -q "get(/databases/\$(database)/documents/packingOrders/\$(request.resource.data.orderId)).data.orderType == 'TT'" firestore.rules
          grep -q 'request.resource.data.diff(resource.data).affectedKeys().hasOnly' firestore.rules
          echo "Source/Rules checks passed — V26.1.2 / code 44"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run preflight, wage/retention tests, and JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py
          node tools/retention_logic_test.js
          node tools/packing_wage_rules_test.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S | re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks):
                  path = Path(td) / f'script_{i}.js'
                  path.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'JavaScript syntax passed for {len(blocks)} script blocks')
          PY

      - name: Configure stable debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEBUG_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
            test -s app/debug.keystore
            keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "Stable debug keystore loaded from Actions secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; this build uses a temporary debug certificate and Google Sign-In may require reconfiguration."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          ls -lh "$apk"
          sha256sum "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"

      - name: Upload V26.1.2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.2-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
