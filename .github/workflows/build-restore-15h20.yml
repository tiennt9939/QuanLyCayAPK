name: Build RESTORE 15H20

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate restore ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="QuanLyCayAPK-RESTORE-15H20-BUILD-READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Restore ZIP not found:"
            echo "$ZIP_FILE"
            echo
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort | head -200
            exit 1
          fi

          echo "Restore ZIP found:"
          ls -lh "$ZIP_FILE"

      - name: Extract RESTORE 15H20 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf restore-source
          mkdir -p restore-source

          unzip -q \
            "QuanLyCayAPK-RESTORE-15H20-BUILD-READY.zip" \
            -d restore-source

          echo "Extracted files:"
          find restore-source -maxdepth 3 -type f | sort | head -200

      - name: Detect source root
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE=$(find restore-source \
            -type f \
            -path '*/app/build.gradle.kts' \
            -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          SOURCE_ROOT="${APP_GRADLE%/app/build.gradle.kts}"

          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

          echo "Detected source:"
          echo "$SOURCE_ROOT"

          test -f "$SOURCE_ROOT/settings.gradle.kts"
          test -f "$SOURCE_ROOT/build.gradle.kts"
          test -f "$SOURCE_ROOT/app/build.gradle.kts"
          test -f "$SOURCE_ROOT/app/src/main/assets/index.html"

      - name: Verify RESTORE 15H20 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT"

          echo "===== VERSION ====="
          grep -n "versionCode" app/build.gradle.kts || true
          grep -n "versionName" app/build.gradle.kts || true

          echo
          echo "===== OCR BRIDGE ====="

          grep -n \
            "public void ocrShippingImage(String dataUrl, String callback)" \
            app/src/main/java/com/quanlycay/apk/MainActivity.java

          echo
          echo "===== OCR JAVASCRIPT CALL ====="

          grep -n \
            "AndroidBridge.ocrShippingImage(photo" \
            app/src/main/assets/index.html

          echo
          echo "===== SOURCE CHECK PASS ====="

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build RESTORE 15H20 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "===== APK GENERATED ====="
          ls -lh "$APK"

          sha256sum "$APK"

      - name: Upload RESTORE 15H20 APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-RESTORE-15H20-debug
          path: ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
