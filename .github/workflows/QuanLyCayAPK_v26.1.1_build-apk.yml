name: Build ROLL CAY CANH V26.1.1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: roll-cay-canh-v26-1-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android source
        shell: bash
        run: |
          set -euo pipefail

          # If the project files are already at the repository root, use them.
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            echo "Android project found at repository root."
          else
            # This repository currently stores the Android project as a ZIP.
            archive="QuanLyCayAPK-V26.1.0-COMBINED-QUOTA-SYNC-FIX-V3.zip"
            test -s "$archive"
            mkdir -p "$RUNNER_TEMP/quanlycay-source"
            unzip -q "$archive" -d "$RUNNER_TEMP/quanlycay-source"

            settings_file="$(find "$RUNNER_TEMP/quanlycay-source" -type f -name settings.gradle.kts -print -quit)"
            test -n "$settings_file"
            source_root="$(dirname "$settings_file")"
            test -f "$source_root/app/build.gradle.kts"
            cp -a "$source_root"/. .
          fi

      - name: Verify Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f tools/preflight.py
          echo "Android project files found."
          grep -n 'versionName\|versionCode' app/build.gradle.kts || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run source preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S | re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks):
                  path = Path(td) / f'script_{i}.js'
                  path.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'JavaScript syntax passed for {len(blocks)} script blocks')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.1-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
