name: Build ROLL CAY CANH V26.1.1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: roll-cay-canh-v26-1-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android source
        shell: bash
        run: |
          set -euo pipefail
          required_root() {
            local d="$1"
            [[ -f "$d/settings.gradle.kts" &&
               -f "$d/build.gradle.kts" &&
               -f "$d/app/build.gradle.kts" &&
               -f "$d/app/src/main/AndroidManifest.xml" &&
               -f "$d/app/src/main/assets/index.html" &&
               -f "$d/tools/preflight.py" ]]
          }

          if required_root "."; then
            echo "Complete Android source already exists at repository root."
            exit 0
          fi

          archive="QuanLyCayAPK-V26.1.0-COMBINED-QUOTA-SYNC-FIX-V3.zip"
          if [[ ! -s "$archive" ]]; then
            echo "::error::Android source files are incomplete and expected ZIP is missing: $archive"
            echo "Root listing:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          extract="$RUNNER_TEMP/quanlycay-source"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"

          source_root=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if required_root "$candidate"; then
              source_root="$candidate"
              break
            fi
          done < <(find "$extract" -type f -name settings.gradle.kts -print)

          if [[ -z "$source_root" ]]; then
            echo "::error::Could not find a complete Android project inside $archive."
            echo "Files found in archive (first 250):"
            find "$extract" -maxdepth 7 -type f | sort | head -250
            exit 1
          fi

          echo "Using Android project root: $source_root"
          cp -a "$source_root"/. .

      - name: Verify Android source
        shell: bash
        run: |
          set -euo pipefail
          required=(
            settings.gradle.kts
            build.gradle.kts
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            app/src/main/assets/index.html
            tools/preflight.py
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ -s "$f" ]]; then
              echo "PASS: $f"
            else
              echo "::error::Missing or empty required file: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Repository root contents:"
            find . -maxdepth 4 -type f | sort | head -250
            exit 1
          fi
          echo "Android source structure: PASS"
          grep -n 'versionName\|versionCode' app/build.gradle.kts || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run source preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S | re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks):
                  path = Path(td) / f'script_{i}.js'
                  path.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'JavaScript syntax passed for {len(blocks)} script blocks')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.1.1-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
