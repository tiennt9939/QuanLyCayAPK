name: Build ROLL CAY CANH V26 Toolchain

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tools/**"
      - "firestore.rules"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: roll-cay-canh-v26-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. VERIFY SOURCE STRUCTURE
      # ============================================================
      - name: Verify source structure
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY SOURCE STRUCTURE"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/data.json
          test -f app/src/main/assets/quote-background.jpg

          test -f app/src/main/java/com/quanlycay/apk/MainActivity.java

          test -f tools/preflight.py
          test -f firestore.rules

          echo "Source structure: PASS"

      # ============================================================
      # 3. READ APP VERSION
      #    KHÔNG hard-code version vào workflow.
      # ============================================================
      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle.kts | head -n 1
          )"

          VERSION_CODE="$(
            sed -nE \
              's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
              app/build.gradle.kts | head -n 1
          )"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "APPLICATION VERSION"
          echo "=========================================="
          echo "versionName : $VERSION_NAME"
          echo "versionCode : $VERSION_CODE"
          echo "Build base  : V26 toolchain"
          echo "=========================================="

      # ============================================================
      # 4. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK: PASS"

      # ============================================================
      # 6. GRADLE 8.13
      # ============================================================
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # 7. TOOLCHAIN INFORMATION
      # ============================================================
      - name: Verify V26 build toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "V26 BUILD TOOLCHAIN"
          echo "=========================================="

          java -version
          echo
          gradle --version
          echo
          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-35|build-tools;35.0.0' || true

          echo
          echo "V26 TOOLCHAIN READY"

      # ============================================================
      # 8. AUTHORITATIVE PREFLIGHT
      #
      # preflight.py là nơi duy nhất kiểm tra:
      # - version
      # - JavascriptInterface
      # - OCR
      # - assignment
      # - payroll
      # - quote
      # - printing
      # - Firestore rules
      # - combo
      # ============================================================
      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUN AUTHORITATIVE PREFLIGHT"
          echo "=========================================="

          python3 tools/preflight.py

          echo
          echo "PREFLIGHT: PASS"

      # ============================================================
      # 9. JAVASCRIPT SYNTAX
      # ============================================================
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail

          node --version

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          path = Path("app/src/main/assets/index.html")
          source = path.read_text(encoding="utf-8")

          blocks = re.findall(
              r'<script(?:\s[^>]*)?>(.*?)</script>',
              source,
              re.S | re.I
          )

          print(f"JavaScript blocks: {len(blocks)}")

          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks):
                  js = Path(td) / f"script_{i}.js"
                  js.write_text(block, encoding="utf-8")

                  subprocess.run(
                      ["node", "--check", str(js)],
                      check=True
                  )

          print("JavaScript syntax: PASS")
          PY

      # ============================================================
      # 10. FIRESTORE RULES SANITY CHECK
      # ============================================================
      - name: Firestore rules sanity check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIRESTORE RULES SANITY CHECK"
          echo "=========================================="

          test -s firestore.rules

          grep -q "rules_version = '2';" firestore.rules
          grep -q "match /packingOrders/{orderId}" firestore.rules
          grep -q "match /shipmentTrackingClaims/{trackingNo}" firestore.rules
          grep -q "getAfter(" firestore.rules
          grep -q "completionImages.size() == 2" firestore.rules
          grep -q "packSize >= 1" firestore.rules
          grep -q "packSize <= 100" firestore.rules

          echo "Firestore rules sanity: PASS"

      # ============================================================
      # 11. BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD APK"
          echo "=========================================="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo
          echo "APK BUILD: PASS"
          ls -lh "$APK"

      # ============================================================
      # 12. VERIFY APK
      # ============================================================
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 100000

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "APK verification: PASS"

      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V${{ env.APP_VERSION }}-V26-toolchain-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 14. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="
          echo "App version : V${APP_VERSION}"
          echo "Version code: ${APP_VERSION_CODE}"
          echo "Toolchain   : V26"
          echo "Java        : 17"
          echo "Android SDK : 35"
          echo "Build tools : 35.0.0"
          echo "Gradle      : 8.13"
          echo "=========================================="

      # ============================================================
      # 15. DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V${{ env.APP_VERSION || 'unknown' }}-V26-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
            app/build/outputs/apk/debug/**
          if-no-files-found: ignore
          retention-days: 7
