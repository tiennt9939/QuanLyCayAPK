name: Build ROLL CAY CANH V26.2.11 — One-Photo Order Completion + Existing PDF/Barcode Rules

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Đường dẫn file ZIP source V26.2.11 đã được tải lên repository (để trống nếu source đã nằm ở thư mục gốc)'
        required: false
        type: string
        default: 'QuanLyCayAPK-V26.2.11-STORAGE-PERFORMANCE-SOURCE.zip'

permissions:
  contents: read

concurrency:
  group: roll-cay-canh-v26-2-10-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare V26.2.11 Android source
        env:
          REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}
        shell: bash
        run: |
          set -Eeuo pipefail
          is_target_source() {
            local root="$1"
            [[ -f "$root/settings.gradle.kts" && \
               -f "$root/build.gradle.kts" && \
               -f "$root/app/build.gradle.kts" && \
               -f "$root/app/src/main/AndroidManifest.xml" && \
               -f "$root/app/src/main/assets/index.html" && \
               -f "$root/app/src/main/java/com/quanlycay/apk/MainActivity.java" && \
               -f "$root/tools/preflight.py" ]] && \
              grep -Fq 'versionName = "26.2.11"' "$root/app/build.gradle.kts" && \
              grep -Fq 'versionCode = 63' "$root/app/build.gradle.kts"
          }

          if is_target_source .; then
            echo "Using V26.2.11 source at repository root."
          else
            archive="${REQUESTED_SOURCE_ZIP:-}"
            if [[ -z "$archive" || ! -s "$archive" ]]; then
              archive=""
              while IFS= read -r candidate; do
                if [[ -s "$candidate" ]]; then archive="$candidate"; break; fi
              done < <(find . -type f -iname '*V26.2.11*.zip' -not -path './.git/*' -print | sort)
            fi
            if [[ -z "$archive" || ! -s "$archive" ]]; then
              echo "::error::Không tìm thấy source V26.2.11."
              echo "Cách 1: đưa toàn bộ source V26.2.11 vào thư mục gốc repository."
              echo "Cách 2: tải file QuanLyCayAPK-V26.2.11-STORAGE-PERFORMANCE-SOURCE.zip lên repository rồi chạy lại workflow."
              echo "Lưu ý: file ZIP chỉ nằm trên điện thoại chưa có trong GitHub Actions; workflow không thể tự đọc file trên điện thoại."
              exit 1
            fi
            echo "Checking source archive: $archive"
            extract="$RUNNER_TEMP/quanlycay-v2624"
            mkdir -p "$extract"
            unzip -q "$archive" -d "$extract"
            source_root=""
            while IFS= read -r settings; do
              candidate="$(dirname "$settings")"
              if is_target_source "$candidate"; then source_root="$candidate"; break; fi
            done < <(find "$extract" -type f -name settings.gradle.kts -print)
            if [[ -z "$source_root" ]]; then
              echo "::error::ZIP không chứa source Android hoàn chỉnh V26.2.11 (versionCode 63)."
              find "$extract" -maxdepth 5 -type f | sort | head -200
              exit 1
            fi
            cp -a "$source_root"/. .
            is_target_source . || { echo "::error::Source V26.2.11 sau khi giải nén không hợp lệ."; exit 1; }
          fi

      - name: Verify source and Firestore rules
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/quanlycay/apk/MainActivity.java
          test -s firestore.rules
          test -s firestore.indexes.json
          grep -Fq 'versionName = "26.2.11"' app/build.gradle.kts
          grep -Fq 'versionCode = 63' app/build.gradle.kts
          echo "V26.2.11 / code 63 source check: PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run audits and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/preflight.py
          node tools/retention_logic_test.js
          node tools/packing_wage_rules_test.js
          node tools/drive_image_persistence_test.js
          node tools/performance_optimization_test.js
          node tools/packer_assignment_ui_test.js
          node tools/admin_direct_completion_test.js
          node tools/shared_pool_orders_test.js
          node tools/order_list_grouping_test.js
          node tools/daily_profit_test.js
          node tools/tiktok_label_import_test.js
          node tools/tiktok_pdf_real_layout_regression_test.js
          node tools/tiktok_catalog_matcher_test.js
          node tools/tiktok_pdf_barcode_flow_test.js
          node tools/tiktok_pdf_scan_photo_capture_test.js
          node tools/single_photo_completion_test.js
          node tools/tiktok_panel_visibility_test.js
          node tools/tiktok_pdf_bulk_assignment_test.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S | re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks):
                  path = Path(td) / f'script_{i}.js'
                  path.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          subprocess.run(['node', '--check', 'app/src/main/assets/tiktok-label-import.js'], check=True)
          print(f'JavaScript syntax passed for {len(blocks)} inline blocks plus external PDF parser')
          PY

      - name: Configure stable debug signing key when available
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${DEBUG_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
            test -s app/debug.keystore
            keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "Stable debug keystore configured."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 chưa được cấu hình; dùng debug signing mặc định. APK vẫn build được nhưng có thể không cài đè bản ký bằng khóa khác."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          ls -lh "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.2.11-STORAGE-PERFORMANCE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCayAPK-V26.2.11-STORAGE-PERFORMANCE-build-diagnostics
          path: |
            app/build/outputs/**/*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
